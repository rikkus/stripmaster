name: Stripmaster
options:
  bundleIdPrefix: cc.hemsley
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Stripmaster:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Stripmaster
        excludes:
          # The plist is read by the code signer / launcher, not copied into Resources.
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.hemsley.stripmaster
        PRODUCT_NAME: Stripmaster
        PRODUCT_MODULE_NAME: Stripmaster
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Stripmaster/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: stripmaster
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CW7QBC95TL
        ENABLE_HARDENED_RUNTIME: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StripmasterUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: StripmasterUITests
    dependencies:
      - target: Stripmaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.hemsley.stripmaster.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Stripmaster
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CW7QBC95TL
schemes:
  Stripmaster:
    build:
      targets:
        Stripmaster: all
        StripmasterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: StripmasterUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
